name: backfill-history

# 一次性手動執行：把關注名單（逐檔官方月資料）與海外代號（yfinance 2y）補到約 14 個月，供 52 週高低點使用。
# 沒有排程，不影響 update.yml。約 250 個請求、每次間隔 3 秒，預估 15 分鐘內完成。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yfinance exchange_calendars

      - name: Backfill watchlist history
        run: python fetch_prices.py --backfill

      - name: Build adjusted prices
        run: python scripts/adjust.py --check

      - name: Commit data
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "backfill history $(TZ=Asia/Taipei date +%F)"
            git push
          fi
