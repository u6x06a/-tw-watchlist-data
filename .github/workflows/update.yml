
name: update-prices
 
on:
  schedule:
    # 台灣時間週一至週五 17:30（UTC 09:30）；GitHub 排程可能延遲數分鐘
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}   # 可在 Actions 頁面手動執行
 
permissions:
  contents: write
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install requests yfinance
 
      - name: Fetch prices
        run: python fetch_prices.py
 
      - name: Commit data
        if: always()
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "update prices $(TZ=Asia/Taipei date +%F)"
            git push
          fi
 
