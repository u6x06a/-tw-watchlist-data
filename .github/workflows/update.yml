
name: update-prices
 
on:
  schedule:
    # 台灣時間週一至週五 15:07、16:07、17:07（UTC 07:07、08:07、09:07）。
    # GitHub 排程會延遲，尤其整點半點；跑三次互為備援，避開 :00/:30。
    # 腳本依日期合併資料，沒有新資料就不提交，重複執行沒有副作用。
    - cron: "7 7 * * 1-5"
    - cron: "7 8 * * 1-5"
    - cron: "7 9 * * 1-5"
  workflow_dispatch: {}   # 可在 Actions 頁面手動執行
 
permissions:
  contents: write
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install requests yfinance
 
      - name: Fetch prices
        run: python fetch_prices.py
 
      - name: Commit data
        if: always()
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "update prices $(TZ=Asia/Taipei date +%F)"
            git push
          fi
 
